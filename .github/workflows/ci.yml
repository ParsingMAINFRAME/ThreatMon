name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.21
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose up --build -d --wait
      - name: Verify seeded demo and evidence page
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          with urlopen('http://localhost:8000/threats') as response:
              data = json.load(response)
          assert data['demo_data'] and len(data['items']) == 4, data
          with urlopen('http://localhost:8000/news?edition=demo') as response:
              news = json.load(response)
          assert news['edition'] == 'demo' and news['events'], news
          assert all(event['is_demo'] for event in news['events'])
          assert any(len(event['articles']) == 35 for event in news['events'])
          with urlopen('http://localhost:8000/news') as response:
              snapshot = json.load(response)
          assert snapshot['edition'] == 'snapshot' and not snapshot['events'], snapshot
          assert all(source['state'] == 'never_fetched' for source in snapshot['sources'])
          with urlopen('http://localhost:3000/') as response:
              html = response.read().decode().lower()
              assert 'iran reported explosion exercise' not in html
              assert 'global voices' in html and 'gdelt' in html
              assert 'event type' in html and 'neither is severity' in html
          with urlopen('http://localhost:8000/news?channel=signals') as response:
              bulletins = json.load(response)
          assert bulletins['channel'] == 'signals'
          assert {source['source_id'] for source in bulletins['sources']} == {'gdacs', 'nasa'}
          with urlopen('http://localhost:3000/signals?view=bulletins') as response:
              assert response.status == 200
          with urlopen('http://localhost:3000/?edition=demo') as response:
              assert response.status == 200
              html = response.read().decode().lower()
              assert 'synthetic' in html and 'news' in html
          with urlopen('http://localhost:3000/signals') as response:
              assert response.status == 200
              html = response.read().decode().lower()
              assert 'widely deployed edge appliance' in html
              assert 'backend unavailable' not in html
          with urlopen('http://localhost:3000/threats/demo-exploited-cyber-vulnerability') as response:
              assert response.status == 200
              html = response.read().decode().lower()
              assert 'demo-cisa-kev-001' in html
              assert 'backend unavailable' not in html
          PY
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  server-stack:
    runs-on: ubuntu-latest
    env:
      SERVER_COMPOSE: docker compose -f docker-compose.yml -f deploy/docker-compose.server.yml --env-file deploy/ci.env
    steps:
      - uses: actions/checkout@v7.0.1
      - run: printf 'SITE_ADDRESS=localhost\n' > deploy/ci.env
      - run: $SERVER_COMPOSE up --build -d --wait
      - name: Verify HTTPS console, API route and poller
        run: |
          curl -fsSk https://localhost/ | grep -qi gdelt
          curl -fsSk https://localhost/api/health | grep -q '"ok"'
          curl -fsSk https://localhost/api/news | python3 -c "import json,sys; assert json.load(sys.stdin)['edition'] == 'snapshot'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
          test "$($SERVER_COMPOSE ps --status running --services | grep -c poller)" = 1
      - if: always()
        run: $SERVER_COMPOSE logs --no-color
      - if: always()
        run: $SERVER_COMPOSE down -v

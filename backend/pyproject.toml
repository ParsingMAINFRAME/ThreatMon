[project]
name = "threat-situation-room-backend"
version = "0.2.0"
description = "Evidence-first threat dashboard with read-only official feed ingestion."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.110",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
